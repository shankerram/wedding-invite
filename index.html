<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedding Invitation</title>
<meta name="description" content="A banana-leaf wedding invitation">
<!-- the page is on a public host; keep it out of search results.
     A robots.txt here would not help: for a project page the crawler reads
     shankerram.github.io/robots.txt, which belongs to a different repo. -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Lora:ital,wght@0,400;0,500;1,400;1,500&family=Pinyon+Script&family=Cinzel:wght@400;600&family=Tiro+Devanagari+Sanskrit:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  /* the leaf is proportioned off the photograph (w/h 0.89); the card inside
     it is square, like the printed invitation */
  --spreadW: 440px;
  --flapW: 440px;
  --leafH: 492px;

  --g-deep:#1c5f24;
  --g-mid:#3f9e35;
  --g-bright:#68c23f;
  --g-lime:#a7d84a;
  --g-rib:#e2f28a;

  --gold:#c8a13e;
  --gold-lt:#eccd77;
  --gold-dk:#8d6b1d;
  --ink:#4a3524;
  --ink-soft:#7d6549;
  --cream:#fdf7ea;
  --marigold:#f0821e;
  --saffron:#ffc12b;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Lora",Georgia,serif;
  background:#2c211b;
  color:#f2e8db;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

/* ---------- backdrop : brown leather ---------- */
#backdrop{position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(120% 90% at 50% 38%, #6f5b4c 0%, #55443a 38%, #3a2d26 72%, #241b16 100%);
}
#backdrop:before{content:"";position:absolute;inset:0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.55' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='260' height='260' filter='url(%23n)' opacity='0.5'/></svg>");
  opacity:.30;mix-blend-mode:overlay}
#backdrop:after{content:"";position:absolute;inset:0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='500' height='500'><filter id='m'><feTurbulence type='fractalNoise' baseFrequency='0.012' numOctaves='5'/><feDisplacementMap in='SourceGraphic' scale='30'/></filter><g filter='url(%23m)'><rect width='500' height='500' fill='none'/><g stroke='black' stroke-width='9' fill='none' opacity='.5'><circle cx='140' cy='120' r='90'/><circle cx='370' cy='300' r='120'/><circle cx='90' cy='400' r='70'/><circle cx='430' cy='70' r='60'/></g></g></svg>");
  background-size:640px;opacity:.07;filter:blur(1.5px);mix-blend-mode:multiply}
#vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(90% 70% at 50% 45%, transparent 40%, rgba(0,0,0,.55) 100%)}

/* ---------- stage ---------- */
#stage{position:fixed;inset:0;z-index:2;display:grid;place-items:center;perspective:2100px;perspective-origin:50% 46%}
#scaler{transform:scale(var(--s,1));transition:transform .6s cubic-bezier(.22,.9,.28,1)}

#leaf{
  position:relative;
  width:var(--spreadW);height:var(--leafH);
  transform-style:preserve-3d;
  transform:rotateX(var(--tilt,9deg)) rotateZ(var(--roll,0deg));
  transition:transform 1s cubic-bezier(.3,.9,.3,1);
  cursor:pointer;
}
.opened #leaf{--tilt:5deg;cursor:default}

/* soft shadow cast on the leather */
#shadow{position:absolute;left:50%;top:52%;width:calc(var(--spreadW) + 60px);height:calc(var(--leafH) * .82);
  transform:translate(-50%,-50%) translateZ(-14px) rotateX(0deg);
  background:radial-gradient(50% 50% at 50% 50%, rgba(0,0,0,.5), rgba(0,0,0,.26) 58%, transparent 80%);
  filter:blur(24px);transition:width 1s cubic-bezier(.3,.9,.3,1), opacity .8s;pointer-events:none}
.opened #shadow{width:calc(var(--spreadW) + var(--flapW)*2 - 40px);filter:blur(24px);opacity:.85}

/* ---------- leaf skin ---------- */
.skin{position:absolute;inset:0;overflow:hidden;background:
    linear-gradient(90deg, rgba(255,255,255,.14), rgba(255,255,255,0) 20%, rgba(0,0,0,.06) 78%, rgba(0,0,0,.20));
  background-color:var(--g-mid)}
.skin i{position:absolute;left:-2%;right:-2%;height:50.4%;display:block}
.skin i.t{top:0;background-image:
  repeating-linear-gradient(84.2deg,
    rgba(14,54,12,.13) 0 1.3px,
    rgba(120,180,70,.05) 1.3px 2.9px,
    rgba(232,255,176,.15) 2.9px 4.1px,
    rgba(255,255,255,0) 4.1px 8.2px),
  repeating-linear-gradient(84.2deg,
    rgba(10,46,10,.11) 0 1px,
    rgba(255,255,255,0) 1px 27px),
  repeating-linear-gradient(84.2deg,
    rgba(236,255,180,.07) 0 2px,
    rgba(255,255,255,0) 2px 63px);
  -webkit-mask-image:linear-gradient(to top, rgba(0,0,0,1) 78%, rgba(0,0,0,.55));
          mask-image:linear-gradient(to top, rgba(0,0,0,1) 78%, rgba(0,0,0,.55))}
.skin i.b{bottom:0;background-image:
  repeating-linear-gradient(95.8deg,
    rgba(14,54,12,.13) 0 1.3px,
    rgba(120,180,70,.05) 1.3px 2.9px,
    rgba(232,255,176,.15) 2.9px 4.1px,
    rgba(255,255,255,0) 4.1px 8.2px),
  repeating-linear-gradient(95.8deg,
    rgba(10,46,10,.11) 0 1px,
    rgba(255,255,255,0) 1px 27px),
  repeating-linear-gradient(95.8deg,
    rgba(236,255,180,.07) 0 2px,
    rgba(255,255,255,0) 2px 63px);
  -webkit-mask-image:linear-gradient(to bottom, rgba(0,0,0,1) 78%, rgba(0,0,0,.55));
          mask-image:linear-gradient(to bottom, rgba(0,0,0,1) 78%, rgba(0,0,0,.55))}
.skin u{position:absolute;inset:0;display:block;background:
    radial-gradient(64% 46% at 24% 26%, rgba(8,72,20,.52), transparent 72%),
    radial-gradient(56% 44% at 80% 76%, rgba(6,62,14,.50), transparent 74%),
    radial-gradient(38% 30% at 46% 62%, rgba(10,80,24,.34), transparent 72%),
    radial-gradient(50% 36% at 64% 14%, rgba(186,232,92,.44), transparent 72%),
    radial-gradient(44% 46% at 10% 84%, rgba(198,238,98,.42), transparent 74%),
    radial-gradient(34% 26% at 90% 34%, rgba(206,242,110,.38), transparent 72%),
    linear-gradient(178deg, rgba(214,246,128,.30), rgba(0,0,0,0) 16%, rgba(0,0,0,0) 84%, rgba(214,246,128,.30)),
    radial-gradient(124% 96% at 50% 50%, transparent 46%, rgba(206,242,116,.34) 84%, rgba(232,255,158,.62) 100%)}
.skin s{position:absolute;left:0;right:0;top:50%;height:6px;transform:translateY(-50%);display:block;
  background:linear-gradient(180deg, rgba(120,170,50,.55), var(--g-rib) 34%, #f4ffb6 52%, var(--g-rib) 68%, rgba(120,170,50,.45));
  box-shadow:0 0 9px 3px rgba(226,255,138,.42)}
.skin b{position:absolute;inset:0;display:block;pointer-events:none;
  background:linear-gradient(104deg, rgba(255,255,255,0) 18%, rgba(255,255,255,.10) 38%, rgba(255,255,255,.17) 50%, rgba(255,255,255,.05) 64%, rgba(0,0,0,.06) 86%)}
.skin.back u{opacity:.85}

/* ---------- flaps ---------- */
.flap{position:absolute;top:0;width:var(--flapW);height:100%;transform-style:preserve-3d;
  transition:transform 1.15s cubic-bezier(.42,.02,.22,1)}
.flap .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flap .face.b{transform:rotateY(180deg)}

/* hinged exactly on the centre panel's edges — no extra translate,
   so transform-origin really is the crease                        */
#flapL{left:calc(-1 * var(--flapW));transform-origin:100% 50%}
#flapR{left:100%;transform-origin:0% 50%}
/* closed: the right lobe folds over first and lands offset, so its
   rounded tip reads as a curve across the face of the lobe beneath */
/* a lobe's own rotateY(~180deg) flips its translateZ, so these negative
   values put the folded lobes IN FRONT of the card (#book, translateZ(10px)) —
   which is what leaves the card showing only at the notch and the corner */
/* translateX here is applied in the lobe's own rotated frame, so a negative
   value pushes it RIGHT on screen. It stays at 0 so the folded leaf lands as
   the tidy square the real card makes; the lobes still read as two because
   their clip paths taper. */
#flapL{transform:rotateY(177deg) translateZ(-22px)}
#flapR{transform:rotateY(-177deg) translateZ(-64px) translateX(0)}
.opened #flapL{transform:rotateY(0.6deg) translateZ(0)}
.opened #flapR{transform:rotateY(-0.6deg) translateZ(0) translateX(0)}
body:not(.opened) #flapR .face.b{filter:drop-shadow(11px 7px 11px rgba(0,0,0,.62))}
body:not(.opened) #flapL .face.b{filter:drop-shadow(5px 5px 8px rgba(0,0,0,.4))}
/* the two folded layers must not read as one flat sheet */
#flapL .skin.back{filter:brightness(1.14) saturate(.84) hue-rotate(-6deg)}
#flapR .skin.back{filter:brightness(.86) saturate(1.14)}

/* a back face is mirrored by its own rotateY(180deg), so it needs the
   opposite tip — otherwise the folded lobe's curve lands on the wrong side */
#flapL .face.f > *{clip-path:url(#clipLeafL);-webkit-clip-path:url(#clipLeafL)}
#flapL .face.b > *{clip-path:url(#clipLeafR);-webkit-clip-path:url(#clipLeafR)}
#flapR .face.f > *{clip-path:url(#clipLeafR);-webkit-clip-path:url(#clipLeafR)}
#flapR .face.b > *{clip-path:url(#clipLeafL);-webkit-clip-path:url(#clipLeafL)}
.flap .drop{position:absolute;inset:0;pointer-events:none;transition:opacity 1.15s;
  background:linear-gradient(90deg, rgba(0,0,0,.42), transparent 38%)}
#flapR .drop{background:linear-gradient(270deg, rgba(0,0,0,.42), transparent 38%)}
.opened .flap .drop{opacity:0}

/* ---------- centre spread ---------- */
#spread{position:absolute;inset:0;transform-style:preserve-3d}
#spread .skin{clip-path:url(#clipLeafC);-webkit-clip-path:url(#clipLeafC)}
#spreadShade{position:absolute;inset:0;pointer-events:none;transition:opacity 1s .15s;
  background:linear-gradient(90deg, rgba(0,0,0,.5), rgba(0,0,0,.26) 30%, rgba(0,0,0,.26) 70%, rgba(0,0,0,.5));
  clip-path:url(#clipLeafC);-webkit-clip-path:url(#clipLeafC)}
.opened #spreadShade{opacity:0}

/* ---------- the bound book ---------- */
#book{position:absolute;left:20px;right:20px;top:30px;bottom:62px;
  perspective:1500px;perspective-origin:0% 50%;
  /* folded, the card is clipped to the two openings, so it is safe to lift it
     in front of both lobes (flapR reaches translateZ +64) — everywhere else it
     is clipped away. Open, it drops back to just above the leaf. */
  transform:translateZ(80px);
  clip-path:url(#clipPeek)}
/* both are dropped a moment into the unfold, once the lobes have visibly
   moved, so the card does not pop into view before anything has happened */
.opened #book{transform:translateZ(10px);clip-path:none;
  transition:clip-path 0s .2s, transform 0s .2s}

.page{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:0% 50%;
  transition:transform 1.05s cubic-bezier(.52,.02,.28,1);
  border-radius:2px 5px 5px 2px}
.page.flipped{transform:rotateY(-179deg)}
.pf{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;
  border-radius:2px 5px 5px 2px;
  box-shadow:0 6px 18px rgba(0,0,0,.42), 0 1px 0 rgba(255,255,255,.35) inset}
.pf.back{transform:rotateY(180deg);background:
  linear-gradient(115deg,#fdf9ef,#f4e9d4 45%,#fcf7ea);
  border-radius:5px 2px 2px 5px}
.pf.back:after{content:"";position:absolute;inset:0;background:linear-gradient(270deg, rgba(0,0,0,.16), transparent 26%)}
.pf > svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.pf .gutter{position:absolute;left:0;top:0;bottom:0;width:16px;pointer-events:none;
  background:linear-gradient(90deg, rgba(60,40,20,.30), rgba(60,40,20,.06) 55%, transparent)}
.page .sheen{position:absolute;inset:0;pointer-events:none;opacity:0;border-radius:inherit;
  background:linear-gradient(90deg, rgba(255,255,255,.55), rgba(255,255,255,0) 42%)}
.page.turning .sheen{animation:sheen 1.05s ease-in-out}
@keyframes sheen{0%{opacity:0}40%{opacity:.9}100%{opacity:0}}

/* ---------- page copy ----------
   Playfair Display for the weighted lines, Lora italic for the running text,
   Pinyon Script for the two names — matched to the printed invitation.
   Swap the three families here and the whole card follows.            */
.copy{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;color:var(--ink);padding:0 46px}
.gan{width:46px;height:57px;flex:none;display:block;margin:0 auto;
  filter:drop-shadow(0 1px 1px rgba(140,105,35,.35))}
.devn{font-family:"Tiro Devanagari Sanskrit","Noto Serif Devanagari",serif;
  font-size:13px;line-height:1.5;color:#a8791f;margin-top:1px}
.host{font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:15.5px;
  color:#8e1420;line-height:1.24;letter-spacing:.002em}
.req{font-family:"Lora",Georgia,serif;font-style:italic;font-size:13px;
  color:#a02030;line-height:1.38}
.scriptnm{font-family:"Pinyon Script","Playfair Display",cursive;font-size:40px;line-height:.98;
  color:#a3101c;letter-spacing:.005em;text-shadow:0 1px 0 rgba(255,255,255,.5);
  padding-bottom:.06em}
.paren{font-family:"Lora",Georgia,serif;font-style:italic;font-size:11px;
  color:#8e2230;line-height:1.4}
.jn{font-family:"Lora",Georgia,serif;font-style:italic;font-size:16px;color:#9a2030}
.lil{font-family:"Lora",Georgia,serif;font-style:italic;font-size:15px;color:#9a2030}
.big{font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:20px;
  color:#8e1420;line-height:1.24;letter-spacing:.006em}
.big sup{font-size:.54em;vertical-align:super;letter-spacing:0}
.addr{font-family:"Lora",Georgia,serif;font-style:italic;font-size:13px;
  color:#8e2230;line-height:1.44}
.slot{display:flex;align-items:baseline;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:5px}
.slot b{font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:16px;color:#8e1420}
.slot i{font-family:"Lora",Georgia,serif;font-style:italic;font-size:13.5px;color:#8e2230}
.compl{font-family:"Lora",Georgia,serif;font-style:italic;font-size:13px;color:#8e2230}
.compl b{font-family:"Playfair Display",Georgia,serif;font-weight:600;font-style:normal;
  font-size:14.5px;color:#8e1420}
.rule{width:70px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.diamond{width:5px;height:5px;background:var(--gold);transform:rotate(45deg)}
.sep{display:flex;align-items:center;gap:10px}
.mapbtn{display:inline-flex;align-items:center;gap:7px;
  font-family:"Cinzel",serif;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
  color:#7a4a12;text-decoration:none;border:1px solid rgba(140,105,35,.45);
  padding:5px 12px;border-radius:2px;background:rgba(255,248,231,.72);transition:.25s}
.mapbtn:hover{background:#f6e6bd;border-color:var(--gold-dk)}

/* ---------- the tie ---------- */
/* the right lobe folds with rotateY(-177deg), which flips its translateZ(-60px)
   toward the viewer, so the thread has to clear that to sit on top of the fold.
   Once the leaf is open it sinks to just above the leaf surface, which puts it
   behind the card (#book is at translateZ(12px)) with its ends showing. */
#tie{position:absolute;inset:0;z-index:90;pointer-events:none;
  transform:translateZ(112px);transition:transform 1.25s cubic-bezier(.3,.9,.3,1)}
.opened #tie{transform:translateZ(5px)}
#tie svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}

/* the knot slackens off as the ends draw through it */
.untying #tieKnot{transform-box:view-box;transform-origin:208px 250px;
  animation:knotLoosen 1s cubic-bezier(.32,0,.16,1) forwards}
@keyframes knotLoosen{
  to{transform:scale(.84) rotate(9deg) translate(-1.5px,3px);opacity:.9}
}
/* what is left of the loops melts into the loose ends */
.untying #tieLoopU,.untying #tieLoopD{animation:loopFade .62s ease-in .34s forwards}
@keyframes loopFade{to{opacity:0}}
}
/* ---------- tassels ---------- */
#tassels{position:absolute;left:-78px;top:24px;width:104px;height:176px;pointer-events:none;z-index:80;
  transform-origin:78px 6px;opacity:0;transition:opacity .5s .7s;
  animation:swing 5.2s ease-in-out infinite alternate;translate:0 0 22px}
.opened #tassels{opacity:1}
#tassels.kick{animation:kick 1.5s cubic-bezier(.25,.8,.3,1)}
@keyframes swing{from{transform:rotate(-2.4deg)}to{transform:rotate(2.4deg)}}
@keyframes kick{0%{transform:rotate(0)}18%{transform:rotate(-9deg)}42%{transform:rotate(6deg)}
  64%{transform:rotate(-3.4deg)}82%{transform:rotate(1.6deg)}100%{transform:rotate(0)}}

/* ---------- hint + controls ---------- */
#hint{position:fixed;z-index:6;left:50%;bottom:8%;transform:translateX(-50%);text-align:center;
  transition:opacity .5s, transform .5s}
#hint .tapicon{width:34px;height:34px;margin:0 auto 9px;border-radius:50%;
  border:1px solid rgba(240,225,190,.5);display:grid;place-items:center;
  animation:pulse 2.4s ease-in-out infinite}
#hint .tapicon:after{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold-lt);
  box-shadow:0 0 12px var(--gold-lt)}
#hint p{font-family:"Cinzel",serif;font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;
  color:rgba(244,230,201,.82);text-shadow:0 2px 10px rgba(0,0,0,.7)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(236,205,119,.34)}55%{box-shadow:0 0 0 14px rgba(236,205,119,0)}}
.opened #hint{opacity:0;transform:translateX(-50%) translateY(14px);pointer-events:none}

#nav{position:fixed;z-index:6;left:50%;bottom:5.4%;transform:translateX(-50%);
  display:flex;align-items:center;gap:16px;opacity:0;pointer-events:none;transition:opacity .5s .8s}
.opened #nav{opacity:1;pointer-events:auto}
.arw{width:40px;height:40px;border-radius:50%;border:1px solid rgba(236,205,119,.42);
  background:rgba(40,30,22,.5);backdrop-filter:blur(6px);color:#f0dfb8;cursor:pointer;
  display:grid;place-items:center;transition:.22s;font-size:15px;line-height:1}
.arw:hover:not(:disabled){background:rgba(200,161,62,.28);border-color:var(--gold-lt);transform:translateY(-2px)}
.arw:disabled{opacity:.26;cursor:default}
#dots{display:flex;gap:9px;align-items:center}
#dots span{width:6px;height:6px;border-radius:50%;background:rgba(240,223,184,.32);transition:.3s;cursor:pointer}
#dots span.on{background:var(--gold-lt);transform:scale(1.55);box-shadow:0 0 10px rgba(236,205,119,.8)}

#closeBtn{position:fixed;z-index:6;top:20px;right:20px;width:38px;height:38px;border-radius:50%;
  border:1px solid rgba(236,205,119,.34);background:rgba(40,30,22,.45);backdrop-filter:blur(6px);
  color:#f0dfb8;cursor:pointer;font-size:16px;opacity:0;pointer-events:none;transition:.4s}
.opened #closeBtn{opacity:.75;pointer-events:auto}
#closeBtn:hover{opacity:1;background:rgba(200,161,62,.3)}

/* ---------- petals ---------- */
#petals{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden}
.petal{position:absolute;top:-8vh;border-radius:52% 52% 46% 46% / 62% 62% 38% 38%;
  will-change:transform,opacity;animation:fall linear forwards}
@keyframes fall{
  0%{opacity:0;transform:translate3d(0,-10vh,0) rotate(0deg)}
  8%{opacity:.95}
  100%{opacity:0;transform:translate3d(var(--dx,40px),112vh,0) rotate(var(--rot,540deg))}
}

@media (max-width:760px){
  #hint{bottom:9%}
}
@media (prefers-reduced-motion:reduce){
  #leaf,.flap,.page,#scaler,#shadow{transition-duration:.01ms !important}
  #tassels,#hint .tapicon{animation:none !important}
  #tie *{animation:none !important}
  .petal{display:none}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <clipPath id="clipLeafL" clipPathUnits="objectBoundingBox">
      <path d="M1,0.004 C0.86,0.026 0.72,0.000 0.58,0.014 C0.31,0.042 0.075,0.176 0.012,0.418
               C0.002,0.462 0.002,0.538 0.012,0.582 C0.075,0.824 0.31,0.958 0.58,0.986
               C0.72,1.000 0.86,0.974 1,0.996 Z"/>
    </clipPath>
    <clipPath id="clipLeafR" clipPathUnits="objectBoundingBox">
      <path d="M0,0.004 C0.14,0.026 0.28,0.000 0.42,0.014 C0.69,0.042 0.925,0.176 0.988,0.418
               C0.998,0.462 0.998,0.538 0.988,0.582 C0.925,0.824 0.69,0.958 0.42,0.986
               C0.28,1.000 0.14,0.974 0,0.996 Z"/>
    </clipPath>
    <!-- While the leaf is folded the card is clipped to just these two
         openings: the notch in the top edge and the corner at the foot,

/* ------------------------------------------------------------------
   Tiny deterministic RNG so the artwork is identical on every load
------------------------------------------------------------------ */
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return((s>>>0)/4294967296)}}
const R2 = n => Math.round(n*10)/10;

/* ---------------- marigold : a ball of little petal-dots -------- */
const MG_PAL = [
  ["#d8571a","#f0821e","#ffb32a"],
  ["#e8761b","#ffa322","#ffd24a"],
  ["#c94d18","#ef7c1c","#ffc12b"]
];
function marigold(cx,cy,r,seed){
  const p = MG_PAL[seed%3], rnd = rng(seed*77+13);
  let s = `<g><circle cx="${R2(cx)}" cy="${R2(cy)}" r="${R2(r*.98)}" fill="${p[0]}"/>`;
  const rings = [[r*.80,11,0],[r*.56,8,1],[r*.31,5,2],[0,1,2]];
  for(const [rr,n,ci] of rings){
    for(let k=0;k<n;k++){
      const a = (k/n)*6.2832 + rr*0.9 + seed*0.4;
      const x = cx+Math.cos(a)*rr, y = cy+Math.sin(a)*rr;
      const d = r*(.25+rnd()*.06);
      s += `<circle cx="${R2(x)}" cy="${R2(y)}" r="${R2(d)}" fill="${p[ci]}" stroke="rgba(150,58,4,.34)" stroke-width=".45"/>`;
    }
  }
  return s+`</g>`;
}
/* ---------------- jasmine ------------------------------------- */
function jasmine(cx,cy,r){
  let s='<g>';
  for(let k=0;k<5;k++){
    const a=k/5*6.2832+.5, px=cx+Math.cos(a)*r*.52, py=cy+Math.sin(a)*r*.52;
    s+=`<ellipse cx="${R2(px)}" cy="${R2(py)}" rx="${R2(r*.54)}" ry="${R2(r*.40)}" transform="rotate(${R2(a*57.3)} ${R2(px)} ${R2(py)})" fill="#fffdf6" stroke="#ded5bd" stroke-width=".45"/>`;
  }
  return s+`<circle cx="${R2(cx)}" cy="${R2(cy)}" r="${R2(r*.20)}" fill="#f2dc85"/></g>`;
}
function leaflet(cx,cy,r,seed){
  const a=(seed%2?38:-38);
  return `<ellipse cx="${R2(cx)}" cy="${R2(cy)}" rx="${R2(r*.85)}" ry="${R2(r*.42)}" transform="rotate(${a} ${R2(cx)} ${R2(cy)})" fill="#3d7a2c" stroke="#2b5c1e" stroke-width=".4"/>`;
}
/* ---------------- cubic bezier sampler ------------------------- */
function bez(p,t){const u=1-t,a=u*u*u,b=3*u*u*t,c=3*u*t*t,d=t*t*t;
  return{x:a*p[0]+b*p[2]+c*p[4]+d*p[6], y:a*p[1]+b*p[3]+c*p[5]+d*p[7]}}

/* strand of flowers threaded along a cubic curve */
function garland(p,n,r,kind,seed){
  seed=seed||1;
  let s=`<path d="M${p[0]},${p[1]} C${p[2]},${p[3]} ${p[4]},${p[5]} ${p[6]},${p[7]}" fill="none" stroke="#6d9740" stroke-width="1.1" opacity=".5"/>`;
  for(let i=0;i<=n;i++){
    const q=bez(p,i/n);
    if(kind==="marigold")      s+=marigold(q.x,q.y,r,seed+i);
    else if(kind==="jasmine")  s+=(i%3===2? leaflet(q.x,q.y,r*1.55,seed+i) : jasmine(q.x,q.y,r));
    else                       s+=(i%2? marigold(q.x,q.y,r,seed+i) : jasmine(q.x,q.y,r*.92));
  }
  return s;
}

function plumeria(x,y,r,rot,seed){
  const rnd=rng((seed||1)*31+5);
  let p="";
  for(let k=0;k<5;k++){
    const a=k*72+(rot||0);
    p+=`<path d="M0,0 C${R2(-r*.46)},${R2(-r*.44)} ${R2(-r*.40)},${R2(-r*1.00)} 0,${R2(-r*1.14)}
                C${R2(r*.40)},${R2(-r*1.00)} ${R2(r*.46)},${R2(-r*.44)} 0,0 Z"
          transform="rotate(${a})" fill="#fffdf6" stroke="#e6dcc2" stroke-width=".45"/>`;
  }
  const tone = rnd()>.5 ? "#f7dc8e" : "#f3d478";
  return `<g transform="translate(${R2(x)} ${R2(y)})">${p}
    <circle r="${R2(r*.30)}" fill="${tone}" opacity=".9"/>
    <circle r="${R2(r*.15)}" fill="#e9bf55" opacity=".7"/></g>`;
}

/* ---------------- gopuram (temple tower) ----------------------- */
function gopuram(x,baseY,w,h){
  const tiers = 6;
  let s = `<g>`;
  for(let i=0;i<tiers;i++){

    s += `<rect x="${R2(x-ww/2)}" y="${R2(y)}" width="${R2(ww)}" height="${R2(hh*.86)}" rx="1.6"

            fill="#c9bb9c" stroke="#b0a183" stroke-width=".45"/>`;

  s += `<path d="M${R2(x-w*.28)},${R2(topY)} Q${R2(x)},${R2(topY-h*.20)} ${R2(x+w*.28)},${R2(topY)} Z"

    s += `<g transform="translate(${R2(x+k*w*.12)} ${R2(topY-h*.05)})">
            <path d="M0,0 C-2.4,-3.4 -1.6,-7 0,-9.6 C1.6,-7 2.4,-3.4 0,0 Z" fill="#cdbfa4"/>

  s += `<rect x="${R2(x-w*.62)}" y="${R2(baseY-h*.14)}" width="${R2(w*1.24)}" height="${R2(h*.14)}"
          fill="#cfc2a8" stroke="#b0a183" stroke-width=".5"/>`;
  return s + `</g>`;
}

    fl += blade(p[0]*.96, p[1]*.96, L, 4.6+rnd()*2, ang, LEAF_TONE[i%LEAF_TONE.length]);
  });
  pts.forEach((p,i)=>{
    if(i%3===2) fl += jasmine(p[0], p[1], 3.4+rnd()*1.2);
    else        fl += plumeria(p[0], p[1], 7.6+rnd()*3.4, rnd()*72, seed+i);
  });
  for(let i=0;i<7;i++) fl += jasmine(-34+i*11, 3+ (rnd()-.5)*5, 2.8+rnd());
  return `<g transform="translate(${R2(x)} ${R2(baseY)}) scale(${sc})">
    <g transform="translate(0 -46)">${fl}</g>
    <ellipse cy="2" rx="30" ry="5" fill="rgba(90,62,30,.24)"/>
    <path d="M-17,-44 L17,-44 L14,-38 L-14,-38 Z" fill="url(#brassG)" stroke="#8d6b1d" stroke-width=".6"/>
    <path d="M-14,-38 C-30,-30 -30,-10 -20,-2 L20,-2 C30,-10 30,-30 14,-38 Z"
          fill="url(#brassG)" stroke="#8d6b1d" stroke-width=".7"/>
    <path d="M-10,-36 C-23,-28 -23,-12 -15,-4 C-22,-14 -21,-28 -8,-35 Z" fill="#ffe8ab" opacity=".55"/>
    <path d="M-24,-22 L24,-22" stroke="#9c7622" stroke-width="1.5" opacity=".6"/>
    <path d="M-26,-16 L26,-16" stroke="#9c7622" stroke-width="1" opacity=".45"/>
    <path d="M-20,-2 L20,-2 L17,3 L-17,3 Z" fill="#b98f2b" stroke="#8d6b1d" stroke-width=".55"/>
    <ellipse cy="3.2" rx="17" ry="3" fill="#a8802a"/>
  </g>`;
}
/* ---------------- kolam drawn on the floor --------------------- */
function kolamFloor(cx,cy,sc){
  let k=`<g transform="translate(${R2(cx)} ${R2(cy)}) scale(${sc})"
            stroke="#fffdf4" fill="none" stroke-width="1.5" stroke-linecap="round" opacity=".92">`;
  for(let i=0;i<8;i++){
    const a=i*45;
    k+=`<path d="M0,-8 C10,-16 22,-14 26,-4 C22,2 10,2 0,-8 Z" transform="rotate(${a})"/>`;
  }
  for(let i=0;i<8;i++){
    const a=i*45+22.5;
    k+=`<path d="M0,-18 C7,-26 17,-28 23,-22" transform="rotate(${a})"/>`;
  }
  k+=`<circle r="5"/><circle r="9.4"/>`;
  for(let r of [15,23,31]) for(let i=0;i<12;i++){
    const a=(i*30)*Math.PI/180;
    k+=`<circle cx="${R2(Math.cos(a)*r)}" cy="${R2(Math.sin(a)*r)}" r="1.1" fill="#fffdf4" stroke="none"/>`;
  }
  k+=`<path d="M-40,0 C-30,-12 -20,-12 -14,-4 C-20,4 -32,6 -40,0 Z"/>`;
  k+=`<path d="M40,0 C30,-12 20,-12 14,-4 C20,4 32,6 40,0 Z"/>`;
  return k+`</g>`;
}
/* ---------------- tassels -------------------------------------- */

/* =================================================================
   PAGE ARTWORK — one square card frame, shared by both pages.
   Laid out to the printed invitation: a deep garland of leaves, jasmine
   and bells across the top with big plumeria clusters in both corners,
   brass oil lamps hanging down each edge, a faded gopuram and palms
   behind, and two full urns of flowers standing either side of a kolam.
================================================================= */
const PW = 400, PH = 400;
const DEFS = `<defs>
  <linearGradient id="paperGrad" x1="0" y1="0" x2="0.6" y2="1">
    <stop offset="0" stop-color="#fffdf7"/><stop offset="50%" stop-color="#fdf7ea"/>
    <stop offset="100%" stop-color="#f7eeda"/>
  </linearGradient>
  <radialGradient id="warmGlow" cx="50%" cy="34%" r="72%">
    <stop offset="0" stop-color="#fffef9" stop-opacity=".95"/>
    <stop offset="60%" stop-color="#fdf6e6" stop-opacity=".35"/>
    <stop offset="100%" stop-color="#f0e2c6" stop-opacity=".28"/>
  </radialGradient>
  <linearGradient id="brassG" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f3d484"/><stop offset="34%" stop-color="#d7a83c"/>
    <stop offset="70%" stop-color="#b6862a"/><stop offset="100%" stop-color="#8d6b1d"/>
  </linearGradient>
  <radialGradient id="glowG" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#ffd782" stop-opacity=".55"/>
    <stop offset="100%" stop-color="#ffd782" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="floorG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e8d5b6"/><stop offset="45%" stop-color="#dcc39d"/>
    <stop offset="100%" stop-color="#c9ab81"/>
  </linearGradient>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
    <feColorMatrix type="saturate" values="0"/></filter>
</defs>`;
const GRAIN = `<rect width="${PW}" height="${PH}" filter="url(#grain)" opacity=".05" style="mix-blend-mode:multiply"/>`;

/* ---------- the faded temple courtyard behind everything -------- */
function watermark(){
  let s = `<g opacity=".1">`;
  s += palm(44, 300, 104, .98, 11) + palm(82, 312, 78, .80, 17);
  s += palm(348, 298, 108, 1.0, 23) + palm(310, 314, 74, .76, 29);
  s += gopuram(152, 322, 104, 186);
  s += `<g opacity=".8">` + gopuram(300, 328, 58, 104) + `</g>`;
  s += palm(212, 318, 66, .68, 37) + palm(366, 322, 60, .64, 41);
  s += bush(180, 328, 170, 28, 51, ["#c3b493","#b7a888","#cdbe9c"]);
  return s + `</g>`;
}

/* ---------- the garland across the top -------------------------- */
function topBorder(){
  let s = `<g>`;
  const rnd = rng(101);

  /* a deep band of green blades, leaning outward from the middle */
  for(let i=0;i<40;i++){
    const t = i/39, x = t*PW;
    const lean = (t-.5)*120;
    s += blade(x, -8 + Math.sin(t*7.4)*6, 36+rnd()*28, 9+rnd()*6,
               lean + (rnd()-.5)*24, LEAF_TONE[i%LEAF_TONE.length]);
  }
  /* jasmine strings, deep at the edges and lifting clear of the crest */
  for(let i=0;i<13;i++){
    const x = 16 + i*30.8 + (rnd()-.5)*5;
    const len = 20 + Math.abs(i-6)*7.4 + rnd()*7;
    const n = Math.max(3, Math.round(len/8));
    s += `<path d="M${R2(x)},2 L${R2(x)},${R2(len)}" stroke="#7f9c62" stroke-width=".9" opacity=".55"/>`;
    for(let k=0;k<n;k++){
      const y = 5 + k*(len/n);
      s += (k%3===2) ? leaflet(x, y, 5.4, i+k) : jasmine(x, y, 3.6);
    }
    if(Math.abs(i-6) >= 2 && i%2===0) s += bell(x, len + 14, .92, 7);
  }
  /* the corner clusters carry the card — they are the biggest thing on it */
  const corner = (cx, cy, mirror) => {
    let c = `<g transform="translate(${R2(cx)} ${R2(cy)}) scale(${mirror} 1)">`;
    const lv = [[-6,12,32],[12,2,58],[28,16,86],[-18,24,12],[8,32,104],[38,4,44],
                [22,38,126],[-8,42,-12],[44,22,68],[2,52,150],[30,54,112]];
    lv.forEach((l,i)=> c += blade(l[0], l[1], 34+(i%3)*11, 10.5, l[2], LEAF_TONE[i%LEAF_TONE.length]));
    c += plumeria(2, 16, 18, 10, 1)  + plumeria(30, 30, 15.5, 40, 2)
       + plumeria(-8, 44, 14, 70, 3) + plumeria(38, 8, 13.5, 25, 4)
       + plumeria(16, 54, 12.5, 55, 5) + plumeria(52, 40, 11.5, 82, 6)
       + plumeria(-2, 68, 10.5, 18, 7);
    for(let i=0;i<13;i++) c += jasmine(-10 + (i*7)%56, 4 + (i*13)%66, 3.3);
    return c + `</g>`;
  };
  s += corner(17, 0, 1) + corner(PW-17, 0, -1);
  return s + `</g>`;
}

/* ---------- the floor, the urns and the kolam ------------------- */
function bottomScene(){
  let s = `<g>`;
  s += `<rect x="0" y="338" width="${PW}" height="${PH-338}" fill="url(#floorG)" opacity=".92"/>`;
  s += `<rect x="0" y="338" width="${PW}" height="3" fill="#bfa079" opacity=".5"/>`;
  for(let i=0;i<5;i++)
    s += `<path d="M0,${347+i*12} L${PW},${343+i*12}" stroke="#c6a87e" stroke-width=".6" opacity=".33"/>`;
  s += kolamFloor(PW/2, 366, .86);
  s += urn(46, 388, 1.02, 13) + urn(PW-46, 388, 1.02, 27);
  return s + `</g>`;
}

/* ---------- the finished card ----------------------------------- */
function cardArt(){
  return `<svg viewBox="0 0 ${PW} ${PH}" preserveAspectRatio="xMidYMid meet">${DEFS}
    <rect width="${PW}" height="${PH}" fill="url(#paperGrad)"/>
    <rect width="${PW}" height="${PH}" fill="url(#warmGlow)"/>
    ${watermark()}
    ${bottomScene()}
    ${topBorder()}
    ${hangLamp(25, 40, 74, .80, 1)}
    ${hangLamp(PW-25, 40, 74, .80, 2)}
    ${hangLamp(25, 196, 52, .62, 3)}
    ${hangLamp(PW-25, 190, 52, .62, 4)}
    ${GRAIN}</svg>`;
}

/* =================================================================
   THE TIE — fine twisted thread, brick red wound with ochre.

   Colours and proportions are measured off the photograph of the real
   card, not guessed: red #8c1a10, ochre #c9a33e, and a cord about 2.9%
   of the visible leaf width. Keep them muted and keep the twist
   irregular — a bright, evenly striped rope reads as plastic piping.

   Untying morphs the path (SMIL, so Firefox gets it too) rather than
   swapping shapes, and the cord then stays on the leaf rather than
   dropping away.
================================================================= */
const KX = 208, KY = 250;      /* the knot, a little left of the leaf's middle */
const BS = 1.62;               /* bow scale, sized off the photo             */
const bx = d => R2(KX + d*BS);
const by = d => R2(KY + d*BS);

const TIE_SHAPES = {
  /* the band is all but straight on the real card */
  band: [`M-96,258 C40,250 160,246 ${KX},247 C320,248 450,252 556,259`,
         `M-96,262 C40,264 160,270 ${KX},273 C320,276 450,270 556,264`],

  loopU:[`M${KX},${KY} C${bx(-11)},${by(-30)} ${bx(2)},${by(-64)} ${bx(26)},${by(-58)}
          C${bx(48)},${by(-52)} ${bx(29)},${by(-16)} ${KX},${KY} Z`,
         `M${KX},${KY} C${bx(-3)},${by(-9)} ${bx(2)},${by(-19)} ${bx(9)},${by(-17)}
          C${bx(15)},${by(-15)} ${bx(9)},${by(-5)} ${KX},${KY} Z`],

  loopD:[`M${KX},${KY} C${bx(-18)},${by(27)} ${bx(-64)},${by(49)} ${bx(-89)},${by(34)}
          C${bx(-108)},${by(22)} ${bx(-62)},${by(-1)} ${KX},${KY} Z`,
         `M${KX},${KY} C${bx(-6)},${by(9)} ${bx(-19)},${by(15)} ${bx(-27)},${by(11)}
          C${bx(-33)},${by(7)} ${bx(-19)},${by(-1)} ${KX},${KY} Z`],

  tailR:[`M${KX},${KY} C${bx(18)},${by(27)} ${bx(7)},${by(52)} ${bx(22)},${by(74)}
          C${bx(31)},${by(88)} ${bx(19)},${by(101)} ${bx(6)},${by(108)}`,
         `M${KX},${KY} C${bx(25)},${by(33)} ${bx(19)},${by(64)} ${bx(39)},${by(89)}
          C${bx(53)},${by(106)} ${bx(45)},${by(125)} ${bx(31)},${by(137)}`],

  tailL:[`M${KX},${KY} C${bx(-15)},${by(23)} ${bx(-28)},${by(48)} ${bx(-19)},${by(70)}
          C${bx(-11)},${by(88)} ${bx(-25)},${by(99)} ${bx(-40)},${by(105)}`,
         `M${KX},${KY} C${bx(-21)},${by(29)} ${bx(-41)},${by(58)} ${bx(-34)},${by(86)}
          C${bx(-28)},${by(108)} ${bx(-46)},${by(122)} ${bx(-64)},${by(129)}`]
};

/* One length of thread. `untied` renders the relaxed shape directly (for
   reduced motion); otherwise the path carries a SMIL morph into it.

   The twist is built from narrow ochre dashes running down the middle of a
   full-width red stroke, so red always shows along both edges — which is
   what the photograph actually looks like. The dash patterns are uneven on
   purpose, and #threadFuzz roughens the whole thing so it reads as fibre. */
function cord(shape, w, untied){
  const [tied, loose] = shape;
  const d  = untied ? loose : tied;
  const an = untied ? "" : `<animate attributeName="d" begin="indefinite" fill="freeze"
        dur="0.9s" calcMode="spline" keyTimes="0;1" keySplines="0.32 0 0.16 1"
        values="${tied};${loose}"/>`;
  const P = (stroke,width,extra) =>
    `<path d="${d}" fill="none" stroke="${stroke}" stroke-width="${R2(width)}" ${extra||''}>${an}</path>`;
  const round = 'stroke-linecap="round" stroke-linejoin="round"';
  const dash  = a => `stroke-linecap="round" stroke-dasharray="${a.map(v=>R2(v*w)).join(' ')}"`;
  return `
    <g opacity=".18" transform="translate(1.6 3)">${P("#2b0703", w+1.4, round)}</g>
    <g filter="url(#threadFuzz)">
      ${P("#6d150f", w+.7, round+' opacity=".55"')}
      ${P("#8c1a10", w,    round)}
      ${P("#c9a33e", w*.50, dash([.30,.26,.20,.32,.25,.22])+' opacity=".95"')}
      ${P("#d9b44e", w*.26, dash([.22,.34,.15,.40,.19,.30])+' stroke-dashoffset="'+R2(w*.1)+'" opacity=".8"')}
      ${P("#a8352a", w*.30, dash([.13,.52,.10,.46])+' stroke-dashoffset="'+R2(w*.36)+'" opacity=".5"')}
      ${P("#5c0f08", w*.88, dash([.05,.61,.04,.55])+' stroke-dashoffset="'+R2(w*.3)+'" opacity=".3"')}
    </g>`;
}

function buildTie(untied){
  const S = TIE_SHAPES;
  const knot = `<g filter="url(#threadFuzz)">
    <g opacity=".18" transform="translate(1.6 3)">
      <ellipse cx="${KX}" cy="${KY}" rx="15" ry="11.4" fill="#2b0703"/></g>
    <ellipse cx="${KX}" cy="${KY}" rx="14.4" ry="10.8" fill="#6d150f"/>
    <ellipse cx="${KX}" cy="${KY}" rx="12.8" ry="9.2" fill="#8c1a10"/>
    <path d="M${KX-12},${KY-6} C${KX-4},${KY-10.6} ${KX+4},${KY-9.8} ${KX+12},${KY-4}"
          stroke="#c9a33e" stroke-width="4" fill="none" stroke-linecap="round" opacity=".95"/>
    <path d="M${KX-12.4},${KY+2} C${KX-4},${KY+7} ${KX+4},${KY+6.8} ${KX+11.8},${KY+1.2}"
          stroke="#d0a93f" stroke-width="3.2" fill="none" stroke-linecap="round" opacity=".85"/>
    <path d="M${KX-10.4},${KY+7} C${KX-4},${KY+11} ${KX+4},${KY+10.4} ${KX+10.4},${KY+6}"
          stroke="#8a6a1e" stroke-width="2.1" fill="none" stroke-linecap="round" opacity=".5"/>
  </g>`;

  document.getElementById('tie').innerHTML = `
    <svg viewBox="0 0 440 496" aria-hidden="true">
      <defs>
        <filter id="threadFuzz" x="-12%" y="-12%" width="124%" height="124%">
          <feTurbulence type="fractalNoise" baseFrequency="0.62" numOctaves="3" seed="9" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="2.1"
                             xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>
      <g id="tieBand">${cord(S.band,  11.4, untied)}</g>
      <g id="tieTailL">${cord(S.tailL, 10.2, untied)}</g>
      <g id="tieTailR">${cord(S.tailR, 10.2, untied)}</g>
      <g id="tieLoopD">${cord(S.loopD, 10.4, untied)}</g>
      <g id="tieLoopU">${cord(S.loopU, 10.4, untied)}</g>
      <g id="tieKnot">${knot}</g>
    </svg>`;
}

/* pull the bow: loops first, then the ends draw through, then the band relaxes */
function runUntie(){
  const fire = sel => document.querySelectorAll(sel).forEach(a=>a.beginElement());
  fire('#tieLoopU animate, #tieLoopD animate');
  setTimeout(()=> fire('#tieTailL animate, #tieTailR animate'), 130);
  setTimeout(()=> fire('#tieBand animate'), 360);
}

================================================================= */
const book = document.getElementById('book');

PAGES.forEach((p,i)=>{

/* =================================================================
   STATE
================================================================= */
const root   = document.body;
const leafEl = document.getElementById('leaf');
const prevB  = document.getElementById('prev');
const nextB  = document.getElementById('next');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let opened = false, cur = 0, busy = false, untying = false, tied = true;

function paint(){
  pageEls.forEach((el,i)=>{
    const flipped = i < cur;
    el.classList.toggle('flipped', flipped);
    el.style.zIndex = String(flipped ? 10 + i : PAGES.length - i);
  });
  [...dots.children].forEach((d,i)=> d.classList.toggle('on', i===cur));
  prevB.disabled = cur === 0;
  nextB.disabled = cur === PAGES.length - 1;
}

function goto(n){
  n = Math.max(0, Math.min(PAGES.length-1, n));
  if(n === cur || busy) return;
  const forward = n > cur;
  const moving  = forward ? pageEls[cur] : pageEls[n];
  busy = true;
  moving.classList.remove('turning'); void moving.offsetWidth; moving.classList.add('turning');
  cur = n;
  paint();
  swingTassels();
  setTimeout(()=>{ busy=false; moving.classList.remove('turning'); }, reduce?20:1060);
}

function swingTassels(){
  const t = document.getElementById('tassels');
  if(reduce) return;
  t.classList.remove('kick'); void t.offsetWidth; t.classList.add('kick');
  setTimeout(()=>t.classList.remove('kick'), 1500);
}

const tieEl = document.getElementById('tie');

/* the bow has to come undone before the leaf will unfold */
function open(){
  if(opened || untying) return;
  if(!tied){ unfold(); return; }

  /* reduced motion: show it already undone, no pull-through */
  if(reduce){ buildTie(true); tied = false; unfold(); return; }

  untying = true;
  tieEl.classList.add('untying');
  runUntie();
  setTimeout(()=>{
    tied = false; untying = false;
    unfold();                     /* the cord stays, and settles onto the leaf */
  }, 1150);
}

function unfold(){
  opened = true;
  root.classList.add('opened');
  fit();
  rainPetals(30);
  setTimeout(swingTassels, 900);
}

function close(){
  if(!opened || untying) return;
  opened = false;
  cur = 0; paint();
  root.classList.remove('opened');
  fit();
  /* once it is folded again the thread goes back on */
  setTimeout(()=>{
    if(opened) return;
    tieEl.classList.remove('untying');
    buildTie();                   /* fresh, so the SMIL morphs are unfired */
    tied = true;
  }, reduce ? 20 : 1200);
}

/* =================================================================
   RESPONSIVE FIT
================================================================= */
function fit(){
  const cs = getComputedStyle(document.documentElement);
  const sw = parseFloat(cs.getPropertyValue('--spreadW'));
  const fw = parseFloat(cs.getPropertyValue('--flapW'));
  const h  = parseFloat(cs.getPropertyValue('--leafH'));
  const vw = innerWidth, vh = innerHeight;

  /* vertical always has to fit; horizontally we guarantee the readable
     centre panel fits, and let the leaf run off-screen when it must  */
  const needW = opened ? sw + fw*2 : sw + 70;
  const minW  = opened ? sw + 22   : sw + 60;

  const sV = (vh - (vw < 700 ? 150 : 140)) / h;
  const sH = (vw - 24) / needW;
  const sMin = (vw - 24) / minW;

  let s = Math.min(sV, Math.max(sH, Math.min(sMin, sV)));
  s = Math.min(s, 1.32);
  s = Math.max(s, 0.34);
  document.getElementById('scaler').style.setProperty('--s', s.toFixed(4));
}

/* =================================================================
   MARIGOLD PETALS
================================================================= */
const PETAL_COLORS = ["#f0821e","#ffb32a","#e8761b","#ffc93c","#d8571a","#ff9c22"];
function rainPetals(n){
  if(reduce) return;
  const box = document.getElementById('petals');
  for(let i=0;i<n;i++){
    const p = document.createElement('i');
    p.className='petal';
    const w = 7+Math.random()*11, h = w*(.62+Math.random()*.32);
    const dur = 5.5+Math.random()*5.5, delay = Math.random()*2.4;
    p.style.cssText = `left:${Math.random()*100}%;width:${w}px;height:${h}px;
      background:linear-gradient(145deg,${PETAL_COLORS[i%PETAL_COLORS.length]} 20%,${PETAL_COLORS[(i+3)%PETAL_COLORS.length]});
      box-shadow:0 1px 4px rgba(90,40,0,.45), inset 0 -2px 3px rgba(140,60,0,.3);
      --dx:${(Math.random()*260-130).toFixed(0)}px;--rot:${(Math.random()*900-380).toFixed(0)}deg;
      animation-duration:${dur.toFixed(2)}s;animation-delay:${delay.toFixed(2)}s`;
    box.appendChild(p);
    setTimeout(()=>p.remove(), (dur+delay)*1000+200);
  }
}

/* =================================================================
   EVENTS
================================================================= */
leafEl.addEventListener('click', e=>{
  if(untying) return;
  if(!opened){ open(); return; }
  /* once open, tapping the left/right half of the card turns pages */
  const b = document.getElementById('book').getBoundingClientRect();
  if(e.clientX >= b.left && e.clientX <= b.right && e.clientY >= b.top && e.clientY <= b.bottom){
    if(e.target.closest('a')) return;
    goto(e.clientX < b.left + b.width*0.32 ? cur-1 : cur+1);
  }
});
leafEl.addEventListener('keydown', e=>{
  if(untying) return;
  if(e.key===' '||e.key==='Enter'){ e.preventDefault(); opened ? goto(cur+1) : open(); }
});
prevB.addEventListener('click', e=>{ e.stopPropagation(); goto(cur-1); });
nextB.addEventListener('click', e=>{ e.stopPropagation(); goto(cur+1); });
document.getElementById('closeBtn').addEventListener('click', e=>{ e.stopPropagation(); close(); });

addEventListener('keydown', e=>{
  if(e.key==='ArrowRight') goto(cur+1);
  if(e.key==='ArrowLeft')  goto(cur-1);
  if(e.key==='Escape')     close();
});

/* swipe */
let tx=0, ty=0, tracking=false;
addEventListener('touchstart', e=>{ tx=e.touches[0].clientX; ty=e.touches[0].clientY; tracking=true; }, {passive:true});
addEventListener('touchend', e=>{
  if(!tracking) return; tracking=false;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if(Math.abs(dx) < 45 || Math.abs(dx) < Math.abs(dy)) return;
  if(untying) return;
  if(!opened){ open(); return; }
  goto(dx < 0 ? cur+1 : cur-1);
}, {passive:true});

/* gentle parallax tilt on desktop */
if(matchMedia('(hover:hover)').matches && !reduce){
  addEventListener('pointermove', e=>{
    const nx = (e.clientX/innerWidth  - .5);
    const ny = (e.clientY/innerHeight - .5);
    leafEl.style.setProperty('--roll', (nx*2.4).toFixed(2)+'deg');
    leafEl.style.setProperty('--tilt', ((opened?5:9) - ny*3.6).toFixed(2)+'deg');
  });
}

addEventListener('resize', fit);
paint(); fit();
</script>
</body>
</html>
